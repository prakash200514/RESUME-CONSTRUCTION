  <line x1="30" y1="118" x2="370" y2="118" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="30" y="134" font-family="Inter, sans-serif" font-size="7.5" fill="#334155">Accomplished Operations Leader with 6+ years driving cross-functional efficiency, P&amp;L</text>
  <text x="30" y="146" font-family="Inter, sans-serif" font-size="7.5" fill="#334155">optimization, and scaling operations across multi-site regional facilities.</text>
  
