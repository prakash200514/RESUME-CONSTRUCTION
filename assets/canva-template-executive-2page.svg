<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="560" fill="#FFFFFF"/>
  
  <!-- Top Executive Navy Band -->
  <rect x="0" y="0" width="400" height="85" fill="#0F2748"/>
  
  <text x="30" y="40" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">ALEXANDER MORGAN</text>
  <text x="30" y="56" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#93C5FD">SENIOR OPERATIONS MANAGER &bull; 6+ YEARS EXPERIENCE</text>
  <text x="30" y="70" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1">alexander.morgan@company.com &bull; +91 98765 12345 &bull; Bangalore, India</text>
  
  <!-- 2-Page Badge Indicator -->
  <rect x="315" y="18" width="60" height="20" rx="4" fill="#2563EB"/>
